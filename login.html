<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join NIMBU</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f1a;color:#fff;font-family:system-ui,sans-serif}
  .box{width:90%;max-width:360px;background:#141a2b;padding:24px;border-radius:16px;text-align:center}
  input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:12px;border-radius:10px;border:0;font-size:16px}
  button{background:#f5c518;color:#000;font-weight:700;cursor:pointer}
  #msg{margin-top:14px;min-height:20px}
</style>
</head>
<body>
<div class="box">
  <h2>Welcome to NIMBU</h2>
  <p>Every AI. One Universe.</p>
  <input id="email" type="email" placeholder="Enter your email">
  <button id="go">Continue</button>
  <div id="msg"></div>
</div>
<script>
const email = document.getElementById('email');
const msg = document.getElementById('msg');

document.getElementById('go').addEventListener('click', () => {
  const v = email.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
    msg.textContent = 'Please enter a valid email.';
    return;
  }
  const list = JSON.parse(localStorage.getItem('nimbuUsers') || '[]');
  if (!list.includes(v)) list.push(v);
  localStorage.setItem('nimbuUsers', JSON.stringify(list));
  localStorage.setItem('nimbuUser', v);
  fetch('https://formspree.io/f/moejlzla', {
  method: 'POST',
  headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
  body: JSON.stringify({ email: v })
}).catch(() => {});
  msg.textContent = "✅ You're done! Taking you to NIMBU...";
  setTimeout(() => location.href = 'nimbu.html', 1200);
});
</script>
</body>
</html>
