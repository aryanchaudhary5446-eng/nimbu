<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafd"><title>Kitto AI</title>
<style>
(() => {
  const $ = id => document.getElementById(id);
  const STORE = "kitto-chats-v1";

  let chats = [];
  let activeId = null;
  let typing = false;
  let model = "Quantum 3";

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  }[c]));

  function loadChats() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || "[]");
      chats = Array.isArray(saved) ? saved : [];
    } catch {
      chats = [];
    }
  }

  function saveChats() {
    try {
      localStorage.setItem(STORE, JSON.stringify(chats.slice(-30)));
    } catch {
      notice("Couldn't save chat history on this device.");
    }
  }

  function currentChat() {
    return chats.find(c => c.id === activeId);
  }

  function createChat() {
    const chat = {
      id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
      title: "New chat",
      messages: []
    };
    chats.unshift(chat);
    activeId = chat.id;
    saveChats();
    render();
  }

  function notice(message) {
    $("noticeText").textContent = message;
    $("notice").classList.remove("hidden");
  }

  function render() {
    const chat = currentChat();
    const messages = chat?.messages || [];
    const empty = messages.length === 0 && !typing;

    $("home").classList.toggle("hidden", !empty);
    $("chat").classList.toggle("hidden", empty);
    $("chat").innerHTML = messages.map((m, i) => {
      if (m.role === "user") {
        return `<div class="userrow"><div class="bubble">${esc(m.text)}</div></div>`;
      }

      return `<div class="airow">
        <span class="avatar sm"><span class="eyes"><i></i><i></i></span></span>
        <div class="content">
          <div class="heading">Kitto AI <small>AI response</small></div>
          <div class="answer">${esc(m.text)}</div>
          <div class="actions">
            <button data-copy="${i}">Copy</button>
          </div>
        </div>
      </div>`;
    }).join("") + (typing ? `
      <div class="airow">
        <span class="avatar sm"><span class="eyes"><i></i><i></i></span></span>
        <div class="content">
          <div class="heading">Kitto AI <small>Thinking…</small></div>
          <div class="typing"><i></i><i></i><i></i></div>
        </div>
      </div>` : "");

    $("send").disabled = typing;
    $("main").scrollTop = $("main").scrollHeight;
  }

  function resize() {
    const input = $("prompt");
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
    $("sendIcon").textContent = input.value.trim() ? "↑" : "➤";
  }

  async function send(value) {
    const question = (value === undefined ? $("prompt").value : value).trim();
    if (!question || typing) return;

    if (!window.NIMBU_SUPABASE) {
      notice("Supabase isn't loaded. Check the Supabase scripts.");
      return;
    }

    if (!currentChat()) createChat();

    const chat = currentChat();
    chat.messages.push({ role: "user", text: question });

    if (chat.title === "New chat") {
      chat.title = question.slice(0, 45);
    }

    $("prompt").value = "";
    resize();
    typing = true;
    saveChats();
    render();

    try {
      const { data, error } = await window.NIMBU_SUPABASE
        .functions.invoke("swift-endpoint", {
          body: { question }
        });

      if (error) throw error;

      const answer = data?.answer;
      if (typeof answer !== "string" || !answer.trim()) {
        throw new Error("The AI returned an empty response.");
      }

      chat.messages.push({ role: "assistant", text: answer });
      saveChats();
    } catch (error) {
      console.error("KITTO AI error:", error);
      chat.messages.push({
        role: "assistant",
        text: "I couldn't get a response from the AI right now. Please check your connection and try again."
      });
      saveChats();
    } finally {
      typing = false;
      render();
    }
  }

  function showHistory() {
    const drawer = document.querySelector(".drawer");
    if (!drawer) return;

    let section = $("kittoHistoryList");
    if (!section) {
      section = document.createElement("div");
      section.id = "kittoHistoryList";
      section.innerHTML = '<div class="label">Recent chats</div>';
      const promo = drawer.querySelector(".promo");
      drawer.insertBefore(section, promo);
    }

    section.querySelectorAll(".kitto-history-item").forEach(el => el.remove());

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "item kitto-history-item";
      button.textContent = chat.title || "New chat";
      button.style.width = "100%";
      button.onclick = () => {
        activeId = chat.id;
        $("overlay").classList.add("hidden");
        render();
      };
      section.appendChild(button);
    });
  }

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.onclick = () => send(button.dataset.prompt);
  });

  $("send").onclick = () => send();
  $("prompt").addEventListener("input", resize);
  $("prompt").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  $("openMenu").onclick = () => {
    showHistory();
    $("overlay").classList.remove("hidden");
  };

  $("closeMenu").onclick = $("shade").onclick = () =>
    $("overlay").classList.add("hidden");

  $("newChat").onclick = () => {
    createChat();
    $("overlay").classList.add("hidden");
    $("prompt").focus();
  };

  $("history").onclick = () => {
    showHistory();
    notice("Choose a conversation from Recent chats.");
  };

  $("settings").onclick = () => notice("Settings are not connected yet.");
  $("upgrade").onclick = () => notice("Paid plans aren't configured yet.");
  $("profile").onclick = () => notice("KITTO AI · Your AI workspace");
  $("plans").onclick = () => notice("Upgrade options aren't configured yet.");
  $("noticeX").onclick = () => $("notice").classList.add("hidden");

  $("modelBtn").onclick = () => {
    $("models").classList.toggle("hidden");
  };

  $("models").querySelectorAll("[data-model]").forEach(button => {
    button.onclick = () => {
      model = button.dataset.model;
      $("modelName").textContent = model;
      $("models").classList.add("hidden");
      notice("Display preference updated. The backend model stays unchanged.");
    };
  });

  $("toolsBtn").onclick = () => $("tools").classList.toggle("hidden");
  $("attach").onclick = () => notice("File analysis isn't connected yet.");
  $("explore").onclick = () => notice("More tools can be integrated next.");

  $("mic").onclick = () => {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      notice("Voice input isn't supported in this browser.");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.onresult = event => {
      $("prompt").value = event.results[0][0].transcript;
      resize();
      $("prompt").focus();
    };
    recognition.onerror = () => notice("Voice input failed. Please try again.");
    recognition.start();
    notice("Listening… speak now.");
  };

  $("chat").addEventListener("click", async event => {
    const button = event.target.closest("[data-copy]");
    if (!button) return;

    const message = currentChat()?.messages[Number(button.dataset.copy)];
    if (!message) return;

    try {
      await navigator.clipboard.writeText(message.text);
      notice("Copied to clipboard.");
    } catch {
      notice("Copy isn't available in this browser.");
    }
  });

  document.addEventListener("click", event => {
    if (!$("models").contains(event.target) &&
        !$("modelBtn").contains(event.target)) {
      $("models").classList.add("hidden");
    }

    if (!$("tools").contains(event.target) &&
        !$("toolsBtn").contains(event.target)) {
      $("tools").classList.add("hidden");
    }
  });

  loadChats();

  if (chats.length) {
    activeId = chats[0].id;
  } else {
    createChat();
  }

  resize();
  render();
})();

</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="ib" id="openMenu" aria-label="Open menu"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<button class="plan" id="upgrade"><span>Free plan</span><span style="color:#a2a8b7">•</span><b>Upgrade</b></button>
<button class="ib" id="profile" aria-label="Kitto profile"><span class="avatar sm"><span class="eyes"><i></i><i></i></span></span></button>
</header>
<main class="main" id="main">
<section class="home" id="home">
<div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M32 4C37.2 20.8 43.2 26.8 60 32C43.2 37.2 37.2 43.2 32 60C26.8 43.2 20.8 37.2 4 32C20.8 26.8 26.8 20.8 32 4Z" fill="url(#g)"/><defs><linearGradient id="g" x1="8" y1="7" x2="54" y2="58"><stop stop-color="#6AD7FF"/><stop offset=".52" stop-color="#7C82FF"/><stop offset="1" stop-color="#A66BFF"/></linearGradient></defs></svg></div>
<div class="eyebrow">Your AI companion</div><h1>Good Morning, Kitto</h1><p class="intro">Ask me anything, get ideas, solve problems, or just chat. I'm here to help you be your best.</p>
<div class="cards">
<button class="card" data-prompt="Give me creative ideas for my project, studies or business."><span class="ci">♧</span><strong>Get ideas</strong><small>For your projects, studies or business</small></button>
<button class="card" data-prompt="Help me write, debug or understand some code."><span class="ci">‹/›</span><strong>Write code</strong><small>Debug, build or explain anything</small></button>
<button class="card" data-prompt="Teach me something useful in simple, clear steps."><span class="ci">▤</span><strong>Learn something</strong><small>In simple, clear steps</small></button>
<button class="card" data-prompt="Help me become more productive with a simple routine."><span class="ci">✧</span><strong>Be more productive</strong><small>Tools, tips and workflows</small></button>
</div>
</section><section class="chat hidden" id="chat" aria-live="polite"></section>
</main>
<footer class="bottom">
<div class="notice hidden" id="notice"><span id="noticeText"></span><button id="noticeX">✕</button></div>
<div class="composer"><textarea id="prompt" rows="2" placeholder="How can I help you today?" aria-label="Message Kitto"></textarea><div class="row">
<div class="modelwrap"><button class="circle" id="toolsBtn" aria-label="More tools">＋</button><div class="tools hidden" id="tools"><button id="attach">＋ Attach a file</button><button id="explore">✧ Explore tools</button></div></div>
<div class="modelwrap"><button class="modelbtn" id="modelBtn"><span id="modelName">Quantum 3</span><span>⌄</span></button><div class="menu hidden" id="models"><button class="selected" data-model="Quantum 3">Quantum 3 ✓</button><button data-model="Fast">Fast</button><button data-model="Creative">Creative</button></div></div><div class="spacer"></div>
<button class="circle" id="mic" aria-label="Voice input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
<button class="send" id="send" aria-label="Send message"><span id="sendIcon">▥</span></button>
</div></div><p class="disclaimer">Kitto can make mistakes. Check important information.</p>
</footer>
<div class="overlay hidden" id="overlay"><aside class="drawer"><div class="dhead"><span style="display:flex;align-items:center;gap:10px"><span class="avatar sm"><span class="eyes"><i></i><i></i></span></span>Kitto AI</span><button class="ib" id="closeMenu">✕</button></div><button class="item" id="newChat">＋　New chat</button><div class="label">Workspace</div><button class="item" id="history">▤　Chat history</button><button class="item" id="settings">⚙　Settings</button><div class="promo"><span style="color:#514de8;font-size:20px">✧</span><strong>Get more with Kitto</strong><p>Explore more ways to learn, build and create.</p><button id="plans">Explore plans →</button></div></aside><div id="shade" style="flex:1"></div></div>
</div>
<script>


</body></html>
