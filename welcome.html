<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffb800">
<title>NIMBU — Every AI. One Universe.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0e;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:100%;max-width:420px}
.logo{text-align:center;font-size:54px}
h1{text-align:center;font-size:38px;margin:0;letter-spacing:-2px}
.tag{text-align:center;color:#aaa;margin:5px 0 25px;font-size:12px;letter-spacing:3px}
.card{background:#151519;border:1px solid #29292f;border-radius:22px;padding:24px}
.tabs{display:flex;background:#222227;padding:4px;border-radius:12px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:transparent;color:#aaa;padding:12px;border-radius:9px;font-weight:700}
.tabs button.active{background:#ffb800;color:#111}
h2{margin:0 0 7px;font-size:24px}
p{color:#aaa;font-size:14px;line-height:1.5}
label{display:block;font-size:13px;margin:15px 0 7px;color:#ddd}
input{width:100%;padding:14px;background:#0e0e12;border:1px solid #393940;border-radius:10px;color:#fff;font:inherit;outline:none}
input:focus{border-color:#ffb800}
.primary{width:100%;margin-top:20px;padding:14px;background:#ffb800;color:#111;border:0;border-radius:11px;font-weight:800;font-size:15px}
.link{display:block;text-align:center;color:#ffcb42;margin-top:15px;font-size:13px;cursor:pointer}
#message{font-size:13px;overflow-wrap:anywhere}
.note{text-align:center;font-size:12px;color:#777;margin-top:18px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <div class="logo">🍋</div>
  <h1>NIMBU</h1>
  <div class="tag">EVERY AI. ONE UNIVERSE.</div>

  <section class="card">
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Log in</button>
      <button id="signupTab" type="button">Create account</button>
    </div>

    <h2 id="heading">Welcome back</h2>
    <p id="subtitle">Log in to your NIMBU account.</p>

    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="6"
        autocomplete="current-password" placeholder="At least 6 characters"
        required>

      <button class="primary" id="submitBtn" type="submit">Log in</button>
    </form>

    <span id="forgot" class="link">Forgot password?</span>
    <p id="message" role="status" aria-live="polite"></p>
    <a id="enterApp" class="primary hidden"
      href="nimbu.html" style="display:block;text-align:center;text-decoration:none">
      Enter NIMBU
    </a>
  </section>
  <div class="note">Your AI universe starts here. 🍋</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// STEP 2: Add your Supabase Project URL and publishable/anon key here.
const SUPABASE_URL = 'https://rnrzlmtlpoytrcgcwrkl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xP9nG2Wa7QL9F-PkAvumIg_cis3XAuP';

const message = document.getElementById('message');
const form = document.getElementById('authForm');
const email = document.getElementById('email');
const password = document.getElementById('password');
const submitBtn = document.getElementById('submitBtn');
const forgot = document.getElementById('forgot');
const enterApp = document.getElementById('enterApp');

let mode = 'login';
let supabase;

function showMessage(text) {
  message.textContent = text;
}

function setMode(next) {
  mode = next;
  document.getElementById('loginTab').classList.toggle('active', mode === 'login');
  document.getElementById('signupTab').classList.toggle('active', mode === 'signup');
  document.getElementById('heading').textContent =
    mode === 'login' ? 'Welcome back' : 'Join NIMBU';
  document.getElementById('subtitle').textContent =
    mode === 'login' ? 'Log in to your NIMBU account.' :
    'Create your free NIMBU account.';
  submitBtn.textContent = mode === 'login' ? 'Log in' : 'Create account';
  password.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  forgot.classList.toggle('hidden', mode !== 'login');
  showMessage('');
}

document.getElementById('loginTab').onclick = () => setMode('login');
document.getElementById('signupTab').onclick = () => setMode('signup');

try {
  if (SUPABASE_URL.startsWith('https://') &&
      !SUPABASE_URL.includes('YOUR_SUPABASE') &&
      !SUPABASE_KEY.includes('YOUR_SUPABASE')) {
    supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      showMessage('You are already signed in.');
      enterApp.classList.remove('hidden');
      enterApp.style.display = 'block';
    }
  }
} catch (error) {
  showMessage('Could not initialize authentication. Check your Supabase settings.');
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  if (!supabase) {
    showMessage('Setup needed: add your Supabase Project URL and publishable/anon key in this file.');
    return;
  }

  submitBtn.disabled = true;
  showMessage('Please wait…');

  try {
    const credentials = {
      email: email.value.trim(),
      password: password.value
    };

    if (mode === 'signup') {
      const { data, error } = await supabase.auth.signUp(credentials);
      if (error) throw error;

      if (data.session) {
        showMessage('Account created! You are signed in.');
        enterApp.classList.remove('hidden');
        enterApp.style.display = 'block';
      } else {
        showMessage('Account created. Check your email to verify it, then log in.');
      }
    } else {
      const { error } = await supabase.auth.signInWithPassword(credentials);
      if (error) throw error;

      showMessage('Login successful!');
      enterApp.classList.remove('hidden');
      enterApp.style.display = 'block';
      setTimeout(() => { location.href = 'nimbu.html'; }, 700);
    }
  } catch (error) {
    showMessage(error.message || 'Authentication failed. Please try again.');
  } finally {
    submitBtn.disabled = false;
  }
});

forgot.addEventListener('click', async () => {
  if (!supabase) {
    showMessage('Add your Supabase URL and publishable/anon key first.');
    return;
  }
  if (!email.value.trim()) {
    showMessage('Enter your email address first.');
    email.focus();
    return;
  }

  const { error } = await supabase.auth.resetPasswordForEmail(
    email.value.trim(),
    { redirectTo: location.origin + location.pathname }
  );

  showMessage(error ? error.message : 'If that account exists, a password reset email will arrive shortly.');
});
</script>
</body>
</html>
