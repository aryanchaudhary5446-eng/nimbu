<script>
(function(){
  var d=document.documentElement,s=document.getElementById("splash");if(!s)return;
  var skip=!d.classList.contains("is-app");
  try{if(/[?&]splash=1/.test(location.search))sessionStorage.removeItem("nimbu.splashed");if(sessionStorage.getItem("nimbu.splashed")==="1")skip=true;}catch(e){}
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)skip=true;
  if(skip){s.remove();return;}
  try{sessionStorage.setItem("nimbu.splashed","1");}catch(e){}
  d.classList.add("splash-on");
  var done=function(){if(!s.parentNode)return;s.classList.add("out");setTimeout(function(){s.remove();d.classList.remove("splash-on");},400);};
  s.addEventListener("click",done);setTimeout(done,2700);
})();
</script>
