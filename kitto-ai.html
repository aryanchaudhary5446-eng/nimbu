<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafd"><title>Kitto AI</title>

<style>

:root {
  color-scheme: light;
  --bg: #f7f8fc;
  --ink: #191a2b;
  --muted: #777b91;
  --line: #e8e9f2;
  --blue: #6558f5;
  --card: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--ink);
}

button:focus-visible,
textarea:focus-visible {
  outline: 3px solid #aaa2ff;
  outline-offset: 3px;
}

.app {
  min-height: 100vh;
  min-height: 100dvh;
}

.top {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
}

.ib {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
}

.plan {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: white;
  font-size: 13px;
}

.plan b {
  color: var(--blue);
}

.avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg,#b8f0ff,#9d8bff,#e5c5ff);
}

.avatar.sm {
  width: 28px;
  height: 28px;
}

.eyes {
  display: flex;
  gap: 5px;
}

.eyes i {
  width: 4px;
  height: 7px;
  border-radius: 50%;
  background: #5145ad;
}

.main {
  width: min(900px,100%);
  margin: 0 auto;
  padding: 38px 20px 220px;
}

.home, .chat {
  width: 100%;
}

.logo {
  width: 66px;
  height: 66px;
  margin: 12px auto 20px;
}

.logo svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 8px 15px #a49bff55);
}

.eyebrow {
  color: var(--blue);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
  text-align: center;
}

h1 {
  margin: 12px 0;
  font-size: clamp(29px,6vw,43px);
  line-height: 1.15;
  letter-spacing: -.045em;
  text-align: center;
}

h2, h3 {
  letter-spacing: -.025em;
}

.intro {
  max-width: 510px;
  margin: 0 auto 32px;
  color: var(--muted);
  text-align: center;
  line-height: 1.75;
  font-size: 15px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 14px;
  margin-top: 25px;
}

.card {
  min-width: 0;
  padding: 20px;
  margin: 0 0 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: 0 5px 18px #22224406;
}

button.card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  min-height: 142px;
  text-align: left;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

button.card:hover {
  transform: translateY(-3px);
  border-color: #c9c3ff;
  box-shadow: 0 10px 25px #5145ad12;
}

.ci {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: #f0eeff;
  color: var(--blue);
  font-size: 20px;
  font-weight: 700;
}

button.card strong {
  font-size: 15px;
}

button.card small {
  color: var(--muted);
  line-height: 1.5;
  font-size: 12px;
}

.hidden {
  display: none !important;
}

.chat {
  min-height: 180px;
  padding-bottom: 20px;
}

.chat .card {
  overflow-wrap: anywhere;
  line-height: 1.7;
}

.chat .card strong {
  display: block;
  margin-bottom: 8px;
  color: var(--blue);
}

.chat .card p {
  margin: 0;
}

.bottom {
  position: fixed;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 18px max(12px,env(safe-area-inset-bottom));
  background: linear-gradient(to bottom,transparent,#f7f8fc 18%);
}

.composer {
  position: relative;
  width: min(860px,100%);
  margin: 0 auto;
  padding: 12px;
  border: 1px solid #dedff0;
  border-radius: 22px;
  background: white;
  box-shadow: 0 8px 32px #24204a12;
}

.composer textarea {
  display: block;
  width: 100%;
  min-height: 55px;
  max-height: 150px;
  resize: vertical;
  padding: 10px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
}

.composer textarea:focus-visible {
  outline: none;
}

.row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.circle, .send {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: white;
}

.send {
  border-color: var(--blue);
  background: var(--blue);
  color: white;
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.modelbtn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: white;
  font-size: 12px;
}

.spacer {
  flex: 1;
}

.modelwrap {
  position: relative;
}

.tools, .menu {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 165px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  box-shadow: 0 10px 35px #22224418;
}

.menu {
  left: auto;
  right: 0;
}

.tools button, .menu button {
  padding: 11px;
  border: 0;
  border-radius: 9px;
  background: white;
  text-align: left;
}

.tools button:hover, .menu button:hover,
.menu button.selected {
  background: #f0eeff;
}

.disclaimer {
  margin: 8px auto 0;
  color: var(--muted);
  text-align: center;
  font-size: 10px;
}

.notice {
  width: min(860px,100%);
  margin: 0 auto 8px;
  padding: 12px;
  border: 1px solid #f0d5a0;
  border-radius: 12px;
  background: #fff8e8;
  color: #74501b;
  font-size: 13px;
}

.notice button {
  float: right;
  border: 0;
  background: transparent;
}

.overlay {
  position: fixed;
  z-index: 30;
  inset: 0;
  display: flex;
  background: #16152a66;
}

.drawer {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(310px,85vw);
  height: 100%;
  padding: 18px;
  background: white;
  box-shadow: 10px 0 40px #0002;
}

.dhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  font-weight: 750;
}

.item {
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: #f7f7fb;
  text-align: left;
}

.label {
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.promo {
  margin-top: auto;
  padding: 18px;
  border: 1px solid #e5e0ff;
  border-radius: 16px;
  background: linear-gradient(145deg,#f4f1ff,#f9faff);
}

.promo strong {
  display: block;
  margin-top: 8px;
}

.promo p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.promo button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
}

footer {
  color: var(--ink);
}

@media (min-width: 700px) {
  .main {
    padding-top: 48px;
  }

  .logo {
    margin-top: 20px;
  }
}

@media (max-width: 480px) {
  .top {
    height: 60px;
    padding: 10px 12px;
  }

  .main {
    padding: 25px 14px 205px;
  }

  .logo {
    width: 55px;
    height: 55px;
  }

  .intro {
    font-size: 14px;
    margin-bottom: 24px;
  }

  .cards {
    gap: 10px;
  }

  button.card {
    min-height: 140px;
    padding: 14px;
  }

  .bottom {
    padding-left: 10px;
    padding-right: 10px;
  }

  .composer {
    padding: 9px;
    border-radius: 18px;
  }

  .row {
    gap: 6px;
  }

  .circle, .send {
    width: 36px;
    height: 36px;
  }

  .modelbtn {
    padding: 9px;
    gap: 5px;
  }

  .disclaimer {
    font-size: 9px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

</style>

</head>
<body>
<div class="app">
<header class="top">
<button class="ib" id="openMenu" aria-label="Open menu"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<button class="plan" id="upgrade"><span>Free plan</span><span style="color:#a2a8b7">•</span><b>Upgrade</b></button>
<button class="ib" id="profile" aria-label="Kitto profile"><span class="avatar sm"><span class="eyes"><i></i><i></i></span></span></button>
</header>
<main class="main" id="main">
<section class="home" id="home">
<div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M32 4C37.2 20.8 43.2 26.8 60 32C43.2 37.2 37.2 43.2 32 60C26.8 43.2 20.8 37.2 4 32C20.8 26.8 26.8 20.8 32 4Z" fill="url(#g)"/><defs><linearGradient id="g" x1="8" y1="7" x2="54" y2="58"><stop stop-color="#6AD7FF"/><stop offset=".52" stop-color="#7C82FF"/><stop offset="1" stop-color="#A66BFF"/></linearGradient></defs></svg></div>
<div class="eyebrow">Your AI companion</div><h1>Good Morning, Kitto</h1><p class="intro">Ask me anything, get ideas, solve problems, or just chat. I'm here to help you be your best.</p>
<div class="cards">
<button class="card" data-prompt="Give me creative ideas for my project, studies or business."><span class="ci">♧</span><strong>Get ideas</strong><small>For your projects, studies or business</small></button>
<button class="card" data-prompt="Help me write, debug or understand some code."><span class="ci">‹/›</span><strong>Write code</strong><small>Debug, build or explain anything</small></button>
<button class="card" data-prompt="Teach me something useful in simple, clear steps."><span class="ci">▤</span><strong>Learn something</strong><small>In simple, clear steps</small></button>
<button class="card" data-prompt="Help me become more productive with a simple routine."><span class="ci">✧</span><strong>Be more productive</strong><small>Tools, tips and workflows</small></button>
</div>
</section><section class="chat hidden" id="chat" aria-live="polite"></section>
</main>
<footer class="bottom">
<div class="notice hidden" id="notice"><span id="noticeText"></span><button id="noticeX">✕</button></div>
<div class="composer"><textarea id="prompt" rows="2" placeholder="How can I help you today?" aria-label="Message Kitto"></textarea><div class="row">
<div class="modelwrap"><button class="circle" id="toolsBtn" aria-label="More tools">＋</button><div class="tools hidden" id="tools"><button id="attach">＋ Attach a file</button><button id="explore">✧ Explore tools</button></div></div>
<div class="modelwrap"><button class="modelbtn" id="modelBtn"><span id="modelName">Quantum 3</span><span>⌄</span></button><div class="menu hidden" id="models"><button class="selected" data-model="Quantum 3">Quantum 3 ✓</button><button data-model="Fast">Fast</button><button data-model="Creative">Creative</button></div></div><div class="spacer"></div>
<button class="circle" id="mic" aria-label="Voice input"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
<button class="send" id="send" aria-label="Send message"><span id="sendIcon">▥</span></button>
</div></div><p class="disclaimer">Kitto can make mistakes. Check important information.</p>
</footer>
<div class="overlay hidden" id="overlay"><aside class="drawer"><div class="dhead"><span style="display:flex;align-items:center;gap:10px"><span class="avatar sm"><span class="eyes"><i></i><i></i></span></span>Kitto AI</span><button class="ib" id="closeMenu">✕</button></div><button class="item" id="newChat">＋　New chat</button><div class="label">Workspace</div><button class="item" id="history">▤　Chat history</button><button class="item" id="settings">⚙　Settings</button><div class="promo"><span style="color:#514de8;font-size:20px">✧</span><strong>Get more with Kitto</strong><p>Explore more ways to learn, build and create.</p><button id="plans">Explore plans →</button></div></aside><div id="shade" style="flex:1"></div></div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let messages = [];
let chats = JSON.parse(localStorage.getItem("kitto-chats-v1") || "[]");
let busy = false;

function saveChats() {
  localStorage.setItem("kitto-chats-v1", JSON.stringify(chats));
}

function addMessage(role, text) {
  messages.push({ role, content: text });

  const chat = $("chat");
  if (!chat) return;

  const item = document.createElement("div");
  item.className = "card";
  const label = document.createElement("strong");
  label.textContent = role === "user" ? "You" : "KITTO AI";
  const content = document.createElement("p");
  content.textContent = text;
  content.style.whiteSpace = "pre-wrap";
  item.append(label, content);

  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(text) {
  text = (text || "").trim();
  if (!text || busy) return;

  busy = true;
  const prompt = $("prompt");
  const send = $("send");

  if (prompt) prompt.value = "";
  if (send) send.disabled = true;

  addMessage("user", text);

  const chat = $("chat");
  const typing = document.createElement("div");
  typing.className = "card";
  typing.textContent = "KITTO AI is thinking...";
  if (chat) chat.appendChild(typing);

  try {
    if (!window.NIMBU_SUPABASE) {
      throw new Error("Supabase is not connected. Check supabase.js.");
    }

    const { data, error } =
      await window.NIMBU_SUPABASE.functions.invoke(
        "swift-endpoint",
        { body: { question: text } }
      );

    if (error) throw error;

    const answer = data && data.answer;
    if (!answer) throw new Error("The AI returned an empty answer.");

    typing.remove();
    addMessage("assistant", answer);

    chats.unshift({
      title: text.slice(0, 50),
      messages: messages.slice(),
      date: new Date().toISOString()
    });
    chats = chats.slice(0, 30);
    saveChats();
  } catch (err) {
    typing.textContent =
      "Sorry bro, I couldn't get a response. Check your internet connection and Supabase Edge Function. " +
      (err.message || "");
  } finally {
    busy = false;
    if (send) send.disabled = false;
    if (prompt) prompt.focus();
  }
}

const form = $("prompt") && $("prompt").closest("form");

if (form) {
  form.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage($("prompt").value);
  });
}

if ($("send")) {
  $("send").addEventListener("click", event => {
    if (!form) {
      event.preventDefault();
      sendMessage($("prompt")?.value);
    }
  });
}

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    const text =
      button.dataset.prompt ||
      button.textContent.trim();

    if ($("prompt")) $("prompt").value = text;
    sendMessage(text);
  });
});

if ($("newChat")) {
  $("newChat").addEventListener("click", () => {
    messages = [];
    if ($("chat")) $("chat").replaceChildren();
    if ($("prompt")) $("prompt").value = "";
    if ($("home")) $("home").hidden = false;
  });
}

if ($("history")) {
  $("history").textContent = "Recent chats are saved on this device.";
}

if ($("mic") && "webkitSpeechRecognition" in window) {
  $("mic").addEventListener("click", () => {
    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-IN";
    recognition.onresult = event => {
      $("prompt").value = event.results[0][0].transcript;
    };
    recognition.start();
  });
}

console.log("KITTO AI initialized");
</script>
</body>
</html>
