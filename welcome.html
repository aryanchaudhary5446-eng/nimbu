<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMBU – Every AI. One Universe.</title>
<meta name="description" content="NIMBU is a free AI tools directory. Discover, search and compare AI tools, and find ready-to-use prompts, all in one place.">
<style>
:root{--y:#FFB800}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#fff}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.blob{position:absolute;border-radius:50%;background:var(--y)}
.b1{top:-70px;right:-70px;width:200px;height:200px;animation:drift 9s ease-in-out infinite}
.b2{bottom:-90px;left:-90px;width:220px;height:220px;opacity:.35;animation:drift 11s ease-in-out infinite reverse}
.logo{position:relative;font-size:84px;line-height:1;display:inline-block;animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both,bob 3.2s ease-in-out .7s infinite}
.brand{position:relative;font-size:46px;font-weight:800;letter-spacing:-1px;margin:8px 0 0;animation:rise .6s .15s ease both}
.tag{position:relative;font-size:11px;letter-spacing:4px;font-weight:600;margin-top:6px;animation:rise .6s .25s ease both}
.card{background:var(--y);padding:28px 24px calc(32px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;animation:slideUp .6s .2s cubic-bezier(.2,.8,.2,1) both}
.card h2{margin:0 0 8px;font-size:28px}
.card p{margin:0 0 20px;font-size:14px;line-height:1.5}
.btns{display:flex;gap:12px}
.btn{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;justify-content:center;padding:14px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;text-align:center;transition:transform .2s ease}
.btn:active{transform:scale(.97)}
.dark{background:#000;color:#fff}
.light{background:#fff;color:#000}
.dark::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%);animation:shine 3.6s ease-in-out 1s infinite}
.credit{margin-top:16px;text-align:center;font-size:12px;opacity:.7}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="screen">
  <div class="top">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="logo">🍋</div>
    <div class="brand">nimbu</div>
    <div class="tag">EVERY AI. ONE UNIVERSE.</div>
  </div>
  <div class="card">
    <h2>Welcome</h2>
    <p>Discover, compare and save the best AI tools, all in one place. Free, and no sign-up needed.</p>
    <div class="btns">
      <a class="btn dark" href="nimbu.html">Enter NIMBU</a>
      <a class="btn light" href="nimbu.html#/tools">Explore tools</a>
    </div>
    <div class="credit">Built by Aryan</div>
  </div>
</main>
</body>
</html>
